name: Performance CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'pandas/core/arrays/datetimelike.py'
      - 'pandas/core/arrays/datetime_.py'
      - 'pandas/core/arrays/timedeltas.py'

jobs:
  perf-daily-report:
    name: Daily Report Performance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build pandas
        run: pip install -e . --no-build-isolation

      - name: Run daily report benchmark
        id: perf_check
        run: |
          python workspace/benchmarks/datetime_compare.py | tee /tmp/bench_result.txt
          MEDIAN=$(grep "^Median:" /tmp/bench_result.txt | awk '{print $2}' | sed 's/s//')
          echo "median_s=$MEDIAN" >> $GITHUB_OUTPUT

      # Performance acceptance gate:
      # The DatetimeArray comparison workload (N=10M, ×10 repeats) must complete
      # in under 0.60s median on this runner, corresponding to ≥1.5x speedup
      # over the pre-GH#37462 baseline of ~0.90s.
      #
      # Baseline (before fix): ~0.90s
      # Required (after fix):  < 0.60s   (i.e. speedup >= 1.5x)
      #
      # Reference: https://github.com/pandas-dev/pandas/pull/37462
      - name: Enforce speedup threshold (>= 1.5x over baseline)
        run: |
          MEDIAN="${{ steps.perf_check.outputs.median_s }}"
          python - <<EOF
          import sys
          median = float("$MEDIAN")
          baseline = 0.90   # seconds, measured before GH#37462
          threshold = 1.5   # required minimum speedup ratio
          speedup = baseline / median
          print(f"Measured median: {median:.4f}s")
          print(f"Baseline:        {baseline:.4f}s")
          print(f"Speedup:         {speedup:.3f}x  (required >= {threshold}x)")
          if speedup < threshold:
              print(f"FAIL: speedup {speedup:.3f}x is below threshold {threshold}x")
              sys.exit(1)
          print("PASS")
          EOF
